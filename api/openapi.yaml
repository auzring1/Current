openapi: 3.0.3
info:
  title: Auzring Management API
  version: 0.1.0
  description: |
    REST API used by the Auzring web console. Authentication is a server-side
    session cookie (`__Host-auz_session`) obtained via password + mandatory MFA.
    Every state-changing request must carry a same-origin `Origin` header and,
    once a session exists, the `X-CSRF-Token` header returned by the auth endpoints.
    Agent traffic does NOT use this API (see docs/PROTOCOL.md).
servers:
  - url: /api/v1
tags:
  - name: setup
  - name: auth
  - name: devices
  - name: enrollment
  - name: audit
  - name: inventory
  - name: groups
  - name: reports
  - name: catalog
  - name: deployments
  - name: updates
  - name: releases
paths:
  /setup/status:
    get:
      tags: [setup]
      summary: Whether first-run setup is still pending
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required: { type: boolean }
  /setup/begin:
    post:
      tags: [setup]
      summary: Validate the setup token and get a TOTP secret for the first admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_token, email]
              properties:
                setup_token: { type: string, maxLength: 128 }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: TOTP enrollment data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollment" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /setup/complete:
    post:
      tags: [setup]
      summary: Create the organization, first admin (with MFA) and the internal CA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_token, org_name, display_name, email, password, root_passphrase, totp_code]
              properties:
                setup_token: { type: string, maxLength: 128 }
                org_name: { type: string, minLength: 1, maxLength: 200 }
                display_name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 256 }
                root_passphrase: { type: string, minLength: 16, maxLength: 1024 }
                totp_code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Setup complete; recovery codes are shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      summary: Verify email and password; starts an MFA-pending session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password accepted; MFA required
          content:
            application/json:
              schema:
                type: object
                required: [mfa, csrf_token]
                properties:
                  mfa: { type: string, enum: [verify, enroll] }
                  csrf_token: { type: string }
                  totp_secret: { type: string, description: Present when mfa=enroll }
                  otpauth_uri: { type: string, description: Present when mfa=enroll }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/mfa:
    post:
      tags: [auth]
      summary: Complete sign-in with a TOTP or recovery code
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/mfa/enroll:
    post:
      tags: [auth]
      summary: Enroll a new authenticator (after an MFA reset) and complete sign-in
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the session
      responses:
        "204": { description: Signed out }
  /auth/session:
    get:
      tags: [auth]
      summary: Current user, organization, permissions and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /devices:
    get:
      tags: [devices]
      summary: List devices (requires devices:read)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, active, revoked, retired] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Device" } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /devices/{id}:
    get:
      tags: [devices]
      summary: Device detail including hardware inventory (requires devices:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [devices]
      summary: Delete a revoked device and its inventory, jobs and certificates (requires devices:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /devices/delete:
    post:
      tags: [devices]
      summary: Delete several revoked devices at once; others are skipped (requires devices:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deleted, skipped]
                properties:
                  deleted: { type: integer }
                  skipped: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /devices/{id}/approve:
    post:
      tags: [devices]
      summary: Approve a pending device (requires devices:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Approved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /devices/{id}/revoke:
    post:
      tags: [devices]
      summary: Revoke a device; its live connection is cut immediately (requires devices:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /enrollment-tokens:
    get:
      tags: [enrollment]
      summary: List enrollment tokens (requires enrollment:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EnrollmentToken" } }
    post:
      tags: [enrollment]
      summary: Create an enrollment token; the secret is returned once (requires enrollment:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, max_uses, expires_in_hours, require_approval]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                max_uses: { type: integer, minimum: 1, maximum: 100000 }
                expires_in_hours: { type: integer, minimum: 1, maximum: 8760 }
                require_approval: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [token, enrollment_string, install_command, root_ca_pin]
                properties:
                  token: { $ref: "#/components/schemas/EnrollmentToken" }
                  enrollment_string: { type: string }
                  install_command: { type: string }
                  root_ca_pin: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /enrollment-tokens/{id}/revoke:
    post:
      tags: [enrollment]
      summary: Revoke an enrollment token (requires enrollment:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /audit:
    get:
      tags: [audit]
      summary: Audit log, newest first (requires audit:read)
      parameters:
        - { name: before_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
  /devices/{id}/software:
    get:
      tags: [inventory]
      summary: Software installed on a device (requires devices:read)
      description: System components (hidden in Add/Remove Programs) are omitted unless `include_system=true`.
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: include_system, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, revision, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeviceSoftware" } }
                  total: { type: integer }
                  revision: { type: integer, description: Software inventory revision applied by the server }
                  updated_at: { type: string, format: date-time, nullable: true }
                  truncated: { type: boolean, description: The agent hit its item cap; the list is incomplete }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/software/history:
    get:
      tags: [inventory]
      summary: Software installs, removals and version changes on a device, newest first (requires devices:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: before, in: query, description: Return entries with an id below this one, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SoftwareChange" } }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/users:
    get:
      tags: [inventory]
      summary: User profiles on a device (requires devices:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeviceUser" } }
        "404": { $ref: "#/components/responses/Error" }
  /software:
    get:
      tags: [inventory]
      summary: Fleet-wide software, one row per product (requires devices:read)
      description: Products are grouped by normalized title, so "7-Zip 23.01 (x64)" and "7-Zip 24.08" are one product.
      parameters:
        - { name: q, in: query, description: Case-insensitive substring of product or publisher, schema: { type: string, maxLength: 200 } }
        - { name: include_system, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SoftwareTitle" } }
                  total: { type: integer }
  /software/{id}:
    get:
      tags: [inventory]
      summary: One product with its versions across the fleet, newest first (requires devices:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, name, publisher, versions]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  publisher: { type: string }
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version, device_count]
                      properties:
                        version: { type: string }
                        device_count: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /software/{id}/installs:
    get:
      tags: [inventory]
      summary: Devices that have a product (requires devices:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: version, in: query, description: Exact version string, schema: { type: string, maxLength: 128 } }
        - { name: older_than, in: query, description: Only installs with a version strictly lower than this, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TitleInstall" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /groups:
    get:
      tags: [groups]
      summary: Dynamic groups (requires groups:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Group" } }
    post:
      tags: [groups]
      summary: Create a dynamic group (requires groups:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /groups/preview:
    post:
      tags: [groups]
      summary: Evaluate an unsaved filter and list the matching devices (requires groups:read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filter]
              properties:
                filter: { $ref: "#/components/schemas/Filter" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembers" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /groups/{id}:
    get:
      tags: [groups]
      summary: One group (requires groups:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [groups]
      summary: Replace a group's name, description and filter (requires groups:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [groups]
      summary: Delete a group (requires groups:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /groups/{id}/devices:
    get:
      tags: [groups]
      summary: Current members of a dynamic group (requires groups:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembers" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /reports/software.csv:
    get:
      tags: [reports]
      summary: CSV of every install on active devices (requires inventory:export; audited)
      description: Cells that would be read as spreadsheet formulas (leading `=`, `+`, `-`, `@`, tab, CR) are prefixed with `'`.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: title_id, in: query, schema: { type: string, format: uuid } }
        - { name: include_system, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: CSV download
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /reports/devices.csv:
    get:
      tags: [reports]
      summary: CSV of active devices, optionally one group's members (requires inventory:export; audited)
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: CSV download
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /devices/{id}/jobs:
    get:
      tags: [deployments]
      summary: Recent jobs of a device (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeviceJob" } }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/updates:
    get:
      tags: [deployments]
      summary: Installed programs for which the catalog holds a newer version (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AvailableUpdate" } }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/software/uninstall:
    post:
      tags: [deployments]
      summary: Queue an uninstall job for each listed inventory row (requires deployments:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [source, scope, item_key]
                    properties:
                      source: { type: string, enum: [reg64, reg32, hku, hku32, msi, appx, portable] }
                      scope: { type: string, enum: [machine, user] }
                      user_sid: { type: string }
                      item_key: { type: string }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [job_ids, skipped]
                properties:
                  job_ids: { type: array, items: { type: string, format: uuid } }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [device, reason]
                      properties:
                        device: { type: string, description: The program that was skipped }
                        reason: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/refresh:
    post:
      tags: [devices]
      summary: Ask an online device to send its hardware, software and user information now (requires devices:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202":
          description: Requested
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /updates:
    get:
      tags: [updates]
      summary: Windows updates reported by devices, with approval state and counts (requires updates:read)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: classification, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: ["", Critical, Important, Moderate, Low] } }
        - { name: decision, in: query, schema: { type: string, enum: [pending, approved, declined, hidden] } }
        - { name: missing, in: query, description: Only updates some device is missing, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WindowsUpdate" } }
                  total: { type: integer }
  /updates/decision:
    post:
      tags: [updates]
      summary: Approve, decline or hide updates, or reset them to pending (requires updates:write; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update_ids, decision]
              properties:
                update_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200 }
                decision: { type: string, enum: [approved, declined, hidden, none] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [changed, missing, hide_jobs]
                properties:
                  changed: { type: integer }
                  missing: { type: integer }
                  hide_jobs: { type: integer }
        "422": { $ref: "#/components/responses/Error" }
  /updates/{id}/devices:
    get:
      tags: [updates]
      summary: Devices that report this update, with install attempts (requires updates:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [device_id, hostname, state]
                      properties:
                        device_id: { type: string, format: uuid }
                        hostname: { type: string }
                        online: { type: boolean }
                        state: { type: string, enum: [missing, downloaded, hidden, pending_reboot, failed] }
                        last_error: { type: string }
                        scanned_at: { type: string, format: date-time }
                        revision: { type: integer }
                        attempt_state: { type: string, enum: ["", queued, installed, failed] }
                        attempt_failures: { type: integer }
                        attempt_finished_at: { type: string, format: date-time, nullable: true }
                        ring: { type: string }
  /updates/{id}/install:
    post:
      tags: [updates]
      summary: Install one update now on the listed devices, or on every device that misses it (requires updates:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                device_ids: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
                restart: { $ref: "#/components/schemas/RestartPolicy" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /update-settings:
    get:
      tags: [updates]
      summary: Which update service devices use and whether drivers are included (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
    put:
      tags: [updates]
      summary: Change the update service settings; every device is sent them (requires updates:policy, admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettings" }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /update-rules:
    get:
      tags: [updates]
      summary: Auto-approval rules (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UpdateRule" } }
    post:
      tags: [updates]
      summary: Create an auto-approval rule (requires updates:policy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRule" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRule" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /update-rules/{id}:
    put:
      tags: [updates]
      summary: Replace a rule (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRule" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRule" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [updates]
      summary: Delete a rule; approvals it already made stay (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /update-rings:
    get:
      tags: [updates]
      summary: Rollout rings in order (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UpdateRing" } }
    post:
      tags: [updates]
      summary: Create a ring (requires updates:policy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRing" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRing" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /update-rings/{id}:
    put:
      tags: [updates]
      summary: Replace a ring (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRing" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [updates]
      summary: Delete a ring (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /update-holds:
    get:
      tags: [updates]
      summary: Updates stopped from reaching later rings because a ring failed its success threshold (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, update_id, ring_name, reason, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        update_id: { type: string, format: uuid }
                        title: { type: string }
                        ring_name: { type: string }
                        reason: { type: string }
                        created_at: { type: string, format: date-time }
  /update-holds/{id}/release:
    post:
      tags: [updates]
      summary: Let the update continue to later rings despite the failures (requires updates:policy; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Released }
        "404": { $ref: "#/components/responses/Error" }
  /agent-releases:
    get:
      tags: [releases]
      summary: Stored agent releases, the rollout setting and its progress (requires releases:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, rollout, status]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgentRelease" } }
                  rollout: { $ref: "#/components/schemas/AgentRollout" }
                  status: { $ref: "#/components/schemas/AgentRolloutStatus" }
    post:
      tags: [releases]
      summary: Upload a vendor-signed agent release (requires releases:write; audited)
      description: >
        The agent binary is the raw request body (application/octet-stream). The vendor bundle (.azr, produced by
        auzring-release) travels base64-encoded in X-Release-Bundle. The server verifies the signature against the
        vendor release keys compiled into it and checks the binary against the signed manifest; agents verify again.
      parameters:
        - { name: X-Release-Bundle, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRelease" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agent-releases/{id}/status:
    post:
      tags: [releases]
      summary: Withdraw a release (never offered again; pauses the rollout if it was the target) or make it available again (requires releases:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [available, withdrawn] }
      responses:
        "204": { description: Changed }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agent-releases/{id}:
    delete:
      tags: [releases]
      summary: Delete a release that is not the rollout target (requires releases:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent-rollout:
    get:
      tags: [releases]
      summary: Which release devices should run and how they get there (requires releases:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRollout" }
    put:
      tags: [releases]
      summary: Choose the target release, the pilot and the pacing; release_id null stops updating (requires releases:write; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRolloutInput" }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /update-conflicts:
    get:
      tags: [updates]
      summary: Devices whose update policy is managed by something else (WSUS, deferral policies, disabled automatic updates) (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [device_id, hostname]
                      properties:
                        device_id: { type: string, format: uuid }
                        hostname: { type: string }
                        policy: { $ref: "#/components/schemas/WuPolicy" }
  /devices/{id}/windows-updates:
    get:
      tags: [updates]
      summary: What this device's last Windows Update scan found, plus who manages updates on it (requires updates:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceWindowsUpdates" }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/scan:
    post:
      tags: [updates]
      summary: Scan the device for updates now (requires updates:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/install:
    post:
      tags: [updates]
      summary: Install the chosen updates on this device now, ignoring rings and approval (requires updates:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update_ids]
              properties:
                update_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200 }
                restart: { $ref: "#/components/schemas/RestartPolicy" }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/hide:
    post:
      tags: [updates]
      summary: Hide or unhide updates on this device (requires updates:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update_ids, hide]
              properties:
                update_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200 }
                hide: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/reboot:
    post:
      tags: [updates]
      summary: Restart an online device after a countdown that signed-in users can see (requires updates:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 1440 }
                reason: { type: string, maxLength: 200 }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/packages:
    get:
      tags: [catalog]
      summary: Imported packages (requires catalog:read)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Package" } }
  /catalog/search:
    get:
      tags: [catalog]
      summary: Search imported packages, known suggestions and (for an exact winget identifier) the upstream versions (requires catalog:read)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [imported, suggestions]
                properties:
                  imported: { type: array, items: { $ref: "#/components/schemas/Package" } }
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [identifier, self_updating]
                      properties:
                        identifier: { type: string }
                        self_updating: { type: boolean }
                        note: { type: string }
                  probe:
                    type: object
                    required: [identifier]
                    properties:
                      identifier: { type: string }
                      versions: { type: array, items: { type: string } }
                      error: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /catalog/packages/{id}:
    get:
      tags: [catalog]
      summary: One package with versions, installers and overrides (requires catalog:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDetail" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [catalog]
      summary: Remove a package that no deployment uses (requires catalog:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /catalog/packages/{id}/overrides:
    put:
      tags: [catalog]
      summary: Replace this organization's overrides of a package (requires catalog:override, admin only)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageOverride" }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/import:
    post:
      tags: [catalog]
      summary: Import a winget package version from the winget-pkgs repository (requires catalog:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier]
              properties:
                identifier: { type: string, description: "winget PackageIdentifier, e.g. 7zip.7zip" }
                version: { type: string, description: "Empty = newest" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /catalog/content:
    post:
      tags: [catalog]
      summary: Upload an installer (raw body, at most 2 GiB); stored by SHA-256 (requires catalog:write)
      parameters:
        - { name: X-File-Name, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [sha256, size, file_name]
                properties:
                  sha256: { type: string }
                  size: { type: integer }
                  file_name: { type: string }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /catalog/custom:
    post:
      tags: [catalog]
      summary: Register an uploaded installer as a custom package version (requires catalog:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomPackage" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "422": { $ref: "#/components/responses/Error" }
  /settings:
    get:
      tags: [catalog]
      summary: Organization settings (requires catalog:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
    put:
      tags: [catalog]
      summary: Change organization settings (requires settings:write, admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSettings" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
  /deployments:
    get:
      tags: [deployments]
      summary: Deployments, newest first (requires deployments:read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeploymentSummary" } }
    post:
      tags: [deployments]
      summary: Plan a deployment and queue its jobs (requires deployments:write)
      description: |
        Unverified packages need `unverified_confirmed: true` (audited). Jobs are signed when dispatched and
        carry `starts_at` as not_before, so devices can run them without contacting the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentRequest" }
      responses:
        "201":
          description: Planned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPlan" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /deployments/{id}:
    get:
      tags: [deployments]
      summary: One deployment with job counts per status (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /deployments/{id}/jobs:
    get:
      tags: [deployments]
      summary: Per-device jobs of a deployment (requires deployments:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeploymentJob" } }
        "404": { $ref: "#/components/responses/Error" }
  /deployments/{id}/cancel:
    post:
      tags: [deployments]
      summary: Cancel everything not yet finished (requires deployments:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{id}:
    get:
      tags: [deployments]
      summary: One job with its event log and result (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/retry:
    post:
      tags: [deployments]
      summary: Queue a new attempt of a failed, expired, rejected or cancelled job (requires deployments:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /groups/{id}/members:
    post:
      tags: [groups]
      summary: Add or remove devices of a static group (requires groups:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                add: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
                remove: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
      responses:
        "204": { description: Updated }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /events:
    get:
      tags: [devices]
      summary: Server-Sent Events stream of device changes (requires devices:read)
      description: Events carry only `{type, device_id}`; clients re-fetch through the API.
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-auz_session
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Code:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: { type: string, maxLength: 32, description: 6-digit TOTP or recovery code }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    JobQueued:
      description: A job was queued for the device
      content:
        application/json:
          schema:
            type: object
            required: [job_id]
            properties:
              job_id: { type: string, format: uuid }
    SessionStarted:
      description: Signed in
      content:
        application/json:
          schema:
            type: object
            required: [csrf_token]
            properties:
              csrf_token: { type: string }
              recovery_codes: { type: array, items: { type: string } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    TOTPEnrollment:
      type: object
      required: [totp_secret, otpauth_uri]
      properties:
        totp_secret: { type: string }
        otpauth_uri: { type: string }
    SessionInfo:
      type: object
      required: [user, org, permissions, csrf_token]
      properties:
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
        org:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        permissions: { type: array, items: { type: string } }
        csrf_token: { type: string }
    AvailableUpdate:
      type: object
      required: [name, installed_version, source, scope, item_key, package_id, package_name, latest_version, deployable]
      properties:
        name: { type: string }
        installed_version: { type: string }
        source: { type: string }
        scope: { type: string, enum: [machine, user] }
        user_sid: { type: string }
        item_key: { type: string }
        package_id: { type: string, format: uuid }
        package_name: { type: string }
        identifier: { type: string }
        latest_version: { type: string }
        verified: { type: boolean }
        self_updating: { type: boolean }
        deployable: { type: boolean }
        reason: { type: string }
    WindowsUpdate:
      type: object
      required: [update_id, title, classification, decision, devices_missing]
      properties:
        update_id: { type: string, format: uuid }
        revision: { type: integer }
        title: { type: string }
        kb: { type: array, items: { type: string } }
        classification: { type: string }
        severity: { type: string }
        products: { type: array, items: { type: string } }
        is_driver: { type: boolean }
        release_date: { type: string, format: date-time, nullable: true }
        reboot_required: { type: boolean }
        support_url: { type: string }
        first_seen_at: { type: string, format: date-time }
        decision: { type: string, enum: ["", approved, declined, hidden], description: Empty = pending review }
        decision_source: { type: string, enum: ["", manual, rule] }
        decided_at: { type: string, format: date-time, nullable: true }
        note: { type: string }
        devices_missing: { type: integer }
        devices_pending_reboot: { type: integer }
        devices_installed: { type: integer }
        devices_failed: { type: integer }
        holds: { type: integer }
    RestartPolicy:
      type: object
      additionalProperties: false
      properties:
        allow: { type: string, enum: [never, outside_active_hours, deadline] }
        active_start: { type: integer, minimum: 0, maximum: 1439, description: Device-local minutes after midnight }
        active_end: { type: integer, minimum: 0, maximum: 1439 }
        notify_minutes: { type: integer, minimum: 0, maximum: 1440, description: Countdown shown to signed-in users (default 15) }
        deadline_hours: { type: integer, minimum: 0, maximum: 720, description: For deadline - restart at the latest this long after the install }
    AgentRelease:
      type: object
      required: [id, version, os, arch, sha256, size, status, created_at, devices_on, is_target]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        os: { type: string }
        arch: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        key_id: { type: string }
        notes: { type: string }
        authenticode_subject: { type: string }
        min_version: { type: string }
        status: { type: string, enum: [available, withdrawn] }
        created_at: { type: string, format: date-time }
        devices_on: { type: integer, format: int64, description: Active devices currently running this version }
        is_target: { type: boolean }
    AgentRollout:
      type: object
      required: [release_id, pilot_group_ids, soak_hours, success_threshold, batch_per_tick, paused]
      properties:
        release_id: { type: string, format: uuid, nullable: true }
        pilot_group_ids: { type: array, items: { type: string, format: uuid } }
        soak_hours: { type: integer }
        success_threshold: { type: integer }
        batch_per_tick: { type: integer }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        paused: { type: boolean }
        paused_reason: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    AgentRolloutInput:
      type: object
      additionalProperties: false
      required: [soak_hours, success_threshold, batch_per_tick]
      properties:
        release_id: { type: string, format: uuid, nullable: true }
        pilot_group_ids: { type: array, items: { type: string, format: uuid }, maxItems: 50 }
        soak_hours: { type: integer, minimum: 0, maximum: 720 }
        success_threshold: { type: integer, minimum: 1, maximum: 100 }
        batch_per_tick: { type: integer, minimum: 1, maximum: 1000 }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        paused: { type: boolean }
    AgentRolloutStatus:
      type: object
      required: [versions, updated, failed, queued, pilot_devices, pilot_updated, pilot_failed, waiting]
      properties:
        versions:
          type: array
          items:
            type: object
            required: [version, devices, online]
            properties:
              version: { type: string }
              devices: { type: integer, format: int64 }
              online: { type: integer, format: int64 }
        updated: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        queued: { type: integer, format: int64 }
        pilot_devices: { type: integer }
        pilot_updated: { type: integer, format: int64 }
        pilot_failed: { type: integer, format: int64 }
        waiting: { type: string, description: Why devices outside the pilot are not being updated yet }
    UpdateSettings:
      type: object
      additionalProperties: false
      required: [service]
      properties:
        service: { type: string, enum: [default, windows_update, microsoft_update] }
        include_drivers: { type: boolean }
    UpdateRule:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        classifications: { type: array, items: { type: string }, description: Empty = any }
        severities: { type: array, items: { type: string, enum: [Critical, Important, Moderate, Low, Unrated] }, description: Empty = any }
        include_drivers: { type: boolean }
        delay_days: { type: integer, minimum: 0, maximum: 365, description: Days after release }
        enabled: { type: boolean }
    UpdateRing:
      type: object
      additionalProperties: false
      required: [name, ordinal, success_threshold]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        ordinal: { type: integer, minimum: 1, maximum: 20 }
        group_ids: { type: array, items: { type: string, format: uuid } }
        delay_days: { type: integer, minimum: 0, maximum: 365, description: Days after approval before this ring may install }
        soak_hours: { type: integer, minimum: 0, maximum: 2160, description: How long the next ring waits after this ring started }
        success_threshold: { type: integer, minimum: 1, maximum: 100, description: Percent of reporting devices that must install successfully }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        enabled: { type: boolean }
    WuPolicy:
      type: object
      properties:
        wsus_configured: { type: boolean }
        wsus_server: { type: string }
        wufb_deferrals: { type: boolean }
        no_auto_update: { type: boolean }
        au_options: { type: integer }
        active_hours_policy: { type: boolean }
        wu_service_disabled: { type: boolean }
        effective_source: { type: string }
        notes: { type: array, items: { type: string } }
    DeviceWindowsUpdates:
      type: object
      required: [items, reboot_required]
      properties:
        scanned_at: { type: string, format: date-time, nullable: true }
        scan_error: { type: string }
        reboot_required: { type: boolean }
        truncated: { type: boolean }
        service: { type: integer }
        policy: { $ref: "#/components/schemas/WuPolicy" }
        items:
          type: array
          items:
            type: object
            required: [update_id, title, state]
            properties:
              update_id: { type: string, format: uuid }
              revision: { type: integer }
              state: { type: string, enum: [missing, downloaded, hidden, pending_reboot, failed] }
              last_error: { type: string }
              title: { type: string }
              kb: { type: array, items: { type: string } }
              classification: { type: string }
              severity: { type: string }
              is_driver: { type: boolean }
              release_date: { type: string, format: date-time, nullable: true }
              reboot_required: { type: boolean }
              support_url: { type: string }
              decision: { type: string }
              attempt_state: { type: string }
              attempt_failures: { type: integer }
    DeviceSoftware:
      type: object
      required: [title_id, name, version, source, scope, system_component, first_seen_at, last_seen_at]
      properties:
        title_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        publisher: { type: string }
        source: { type: string, enum: [reg64, reg32, hku, hku32, msi, appx, portable] }
        scope: { type: string, enum: [machine, user] }
        user_sid: { type: string, description: Empty for machine-scope installs }
        item_key: { type: string, description: Uninstall subkey name or MSI product code (identifies the row) }
        install_date: { type: string }
        install_location: { type: string }
        product_code: { type: string }
        system_component: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    SoftwareChange:
      type: object
      required: [id, name, scope, change, observed_at]
      properties:
        id: { type: integer }
        name: { type: string }
        scope: { type: string }
        user_sid: { type: string }
        change: { type: string, enum: [added, removed, version] }
        old_version: { type: string }
        new_version: { type: string }
        observed_at: { type: string, format: date-time }
    DeviceUser:
      type: object
      required: [sid, username, domain, loaded, is_admin]
      properties:
        sid: { type: string }
        username: { type: string }
        domain: { type: string }
        profile_path: { type: string }
        last_logon_at: { type: string, format: date-time, nullable: true }
        loaded: { type: boolean }
        is_admin: { type: boolean }
    SoftwareTitle:
      type: object
      required: [id, name, publisher, device_count, version_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        publisher: { type: string }
        device_count: { type: integer }
        version_count: { type: integer }
    TitleInstall:
      type: object
      required: [device_id, hostname, online, version, scope, source]
      properties:
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        online: { type: boolean }
        version: { type: string }
        scope: { type: string }
        user_sid: { type: string }
        source: { type: string }
        install_date: { type: string }
        install_location: { type: string }
        last_seen_at: { type: string, format: date-time }
    Filter:
      type: object
      description: |
        Filter tree. `op` is one of `and`, `or`, `not` (use `children`), `device`
        (`field`, `cmp`, `value`) or `software` (`title`, optional `match`, `publisher`,
        `version`, `scope`). Allowed fields and limits are in docs/DATA_MODEL.md.
      required: [op]
      properties:
        op: { type: string, enum: [and, or, not, device, software] }
        children: { type: array, items: { $ref: "#/components/schemas/Filter" } }
        field: { type: string }
        cmp: { type: string }
        value: {}
        title: { type: string }
        match: { type: string, enum: [exact, prefix, contains] }
        publisher: { type: string }
        scope: { type: string, enum: [machine, user] }
        version:
          type: object
          required: [cmp, value]
          properties:
            cmp: { type: string, enum: [lt, le, gt, ge, eq, ne] }
            value: { type: string }
    Detection:
      type: object
      required: [kind, key]
      properties:
        kind: { type: string, enum: [msi, registry, file, appx] }
        key: { type: string, maxLength: 512 }
        value_name: { type: string }
        version: { type: string }
        cmp: { type: string, enum: ["", eq, ge] }
    Package:
      type: object
      required: [id, source, identifier, name, verified, self_updating]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [winget, custom] }
        identifier: { type: string }
        name: { type: string }
        publisher: { type: string }
        homepage: { type: string }
        license: { type: string }
        description: { type: string }
        verified: { type: boolean, description: Passed the VM test matrix }
        self_updating: { type: boolean }
        imported_at: { type: string, format: date-time }
        version_count: { type: integer }
    Installer:
      type: object
      required: [id, architecture, scope, type, sha256, unsupported]
      properties:
        id: { type: string, format: uuid }
        architecture: { type: string, enum: [x64, x86, arm64, neutral] }
        scope: { type: string, enum: [machine, user, any] }
        type: { type: string, enum: [msi, msix, inno, nsis, burn, exe, portable, zip] }
        nested_type: { type: string }
        url: { type: string }
        sha256: { type: string }
        size: { type: integer }
        file_name: { type: string }
        product_code: { type: string }
        signer_subject: { type: string }
        silent_args: { type: array, items: { type: string } }
        custom_args: { type: array, items: { type: string } }
        detection: { type: array, items: { $ref: "#/components/schemas/Detection" } }
        unsupported: { type: string, description: Why this installer cannot be deployed (empty = deployable) }
        server_content: { type: boolean }
    PackageOverride:
      type: object
      additionalProperties: false
      properties:
        silent_args: { type: array, items: { type: string }, description: Replaces the manifest's switches; validated tokens only }
        extra_detection: { type: array, items: { $ref: "#/components/schemas/Detection" } }
        pin: { type: string, description: "'' | latest | '= <version>' | '< <version>'" }
        excluded: { type: boolean }
        user_scope_policy: { type: string, enum: ["", report_only, update_in_place, convert_to_machine, remove] }
        self_update_policy: { type: string, enum: ["", defer_to_vendor, enforce] }
    PackageDetail:
      type: object
      required: [package, versions, override, effective_user_scope_policy]
      properties:
        package: { $ref: "#/components/schemas/Package" }
        versions:
          type: array
          items:
            type: object
            required: [id, version, installers]
            properties:
              id: { type: string, format: uuid }
              version: { type: string }
              imported_at: { type: string, format: date-time }
              installers: { type: array, items: { $ref: "#/components/schemas/Installer" } }
        override: { $ref: "#/components/schemas/PackageOverride" }
        effective_user_scope_policy: { type: string }
        effective_user_scope_policy_source: { type: string }
    ImportResult:
      type: object
      required: [package_id, version_id, identifier, version, installers, deployable]
      properties:
        package_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        identifier: { type: string }
        version: { type: string }
        installers: { type: integer }
        deployable: { type: integer }
        warnings: { type: array, items: { type: string } }
    CustomPackage:
      type: object
      additionalProperties: false
      required: [identifier, name, version, sha256, file_name, type, arch, scope]
      properties:
        identifier: { type: string }
        name: { type: string }
        publisher: { type: string }
        version: { type: string }
        description: { type: string }
        sha256: { type: string, description: Hash returned by the content upload }
        file_name: { type: string }
        type: { type: string, enum: [msi, inno, nsis, burn, exe, portable, zip] }
        nested_type: { type: string }
        nested_path: { type: string }
        arch: { type: string, enum: [x64, x86, arm64, neutral] }
        scope: { type: string, enum: [machine, user, any] }
        args: { type: array, items: { type: string } }
        product_code: { type: string }
        signer_subject: { type: string }
        success_codes: { type: array, items: { type: integer } }
        detection: { type: array, items: { $ref: "#/components/schemas/Detection" } }
    OrgSettings:
      type: object
      additionalProperties: false
      required: [user_scope_policy]
      properties:
        user_scope_policy: { type: string, enum: [report_only, update_in_place, convert_to_machine, remove] }
    MaintenanceWindow:
      type: object
      additionalProperties: false
      required: [start_minute, duration_minutes]
      properties:
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0 = Sunday }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        tz: { type: string, description: IANA name; empty = device-local time }
    DeploymentRequest:
      type: object
      additionalProperties: false
      required: [name, action, package_id, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        action: { type: string, enum: [install, update, uninstall] }
        package_id: { type: string, format: uuid }
        version: { type: string, description: Empty = newest allowed by the package's pin }
        scope: { type: string, enum: [machine, user] }
        group_ids: { type: array, items: { type: string, format: uuid } }
        device_ids: { type: array, items: { type: string, format: uuid } }
        starts_at: { type: string, format: date-time }
        expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 72 }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        unverified_confirmed: { type: boolean }
    DeploymentPlan:
      type: object
      required: [deployment_id, devices, jobs, user_jobs, skipped]
      properties:
        deployment_id: { type: string, format: uuid }
        devices: { type: integer }
        jobs: { type: integer }
        user_jobs: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [device, reason]
            properties:
              device: { type: string }
              reason: { type: string }
        per_user_found: { type: integer }
        per_user_policy: { type: string }
    DeploymentSummary:
      type: object
      required: [id, name, action, scope, status, package_name, jobs_total, jobs_succeeded, jobs_failed]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        action: { type: string }
        scope: { type: string }
        status: { type: string, enum: [active, paused, completed, cancelled] }
        package_name: { type: string }
        package_identifier: { type: string }
        version: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        jobs_total: { type: integer }
        jobs_succeeded: { type: integer }
        jobs_failed: { type: integer }
    DeploymentDetail:
      type: object
      required: [id, name, action, scope, status, job_counts]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        action: { type: string }
        scope: { type: string }
        status: { type: string }
        package_id: { type: string, format: uuid }
        package_name: { type: string }
        package_identifier: { type: string }
        version: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        unverified_confirmed: { type: boolean }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        job_counts: { type: object, additionalProperties: { type: integer } }
    JobStatus:
      type: string
      enum: [queued, sent, accepted, waiting, running, succeeded, succeeded_reboot, failed, expired, cancelled, rejected]
    DeploymentJob:
      type: object
      required: [id, device_id, hostname, type, title, status]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        user_sid: { type: string }
        type: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        status_reason: { type: string }
        attempt: { type: integer }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_code: { type: integer, nullable: true }
        detection_passed: { type: boolean, nullable: true }
        reboot_required: { type: boolean }
        depends_on: { type: string, format: uuid, nullable: true }
    DeviceJob:
      type: object
      required: [id, type, title, status]
      properties:
        id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid, nullable: true }
        user_sid: { type: string }
        type: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        status_reason: { type: string }
        attempt: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_code: { type: integer, nullable: true }
        reboot_required: { type: boolean }
    JobDetail:
      type: object
      required: [id, device_id, type, title, status, events]
      properties:
        id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        user_sid: { type: string }
        type: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        status_reason: { type: string }
        attempt: { type: integer }
        created_at: { type: string, format: date-time }
        not_before: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        acked_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_code: { type: integer, nullable: true }
        detection_passed: { type: boolean, nullable: true }
        reboot_required: { type: boolean }
        depends_on: { type: string, format: uuid, nullable: true }
        result:
          type: object
          nullable: true
          properties:
            outcome: { type: string }
            message: { type: string }
            log_tail: { type: string, description: Tail of the installer log, at most 16 KiB }
            installed_version: { type: string }
            already_satisfied: { type: boolean }
            exit_code: { type: integer }
        events:
          type: array
          items:
            type: object
            required: [id, time, kind]
            properties:
              id: { type: integer }
              time: { type: string, format: date-time }
              kind: { type: string }
              message: { type: string }
    GroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        kind: { type: string, enum: [dynamic, static], default: dynamic, description: Fixed at creation }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        filter: { $ref: "#/components/schemas/Filter", description: Required for dynamic groups; a static group has none }
    Group:
      type: object
      required: [id, kind, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [dynamic, static] }
        name: { type: string }
        description: { type: string }
        filter: { $ref: "#/components/schemas/Filter" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupMembers:
      type: object
      required: [items, total]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, hostname, online]
            properties:
              id: { type: string, format: uuid }
              hostname: { type: string }
              chassis: { type: string }
              manufacturer: { type: string }
              model: { type: string }
              os_caption: { type: string }
              os_build: { type: string }
              online: { type: boolean }
              last_seen_at: { type: string, format: date-time, nullable: true }
              software_count: { type: integer }
    Device:
      type: object
      required: [id, site_id, status, hostname, online, enrolled_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, active, revoked, retired] }
        status_reason: { type: string }
        hostname: { type: string }
        os_caption: { type: string }
        os_build: { type: string }
        arch: { type: string }
        agent_version: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serial: { type: string }
        online: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_ip: { type: string }
        enrolled_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        uptime_s: { type: integer }
        pending_reboot: { type: boolean }
        logged_on_user: { type: string }
        replaces_device_id: { type: string, format: uuid, nullable: true }
        chassis: { type: string }
        software_count: { type: integer }
        software_updated_at: { type: string, format: date-time, nullable: true }
        inventory_truncated: { type: boolean }
        hardware: { $ref: "#/components/schemas/Hardware" }
        certificates:
          type: array
          items:
            type: object
            required: [serial, not_before, not_after]
            properties:
              serial: { type: string }
              not_before: { type: string, format: date-time }
              not_after: { type: string, format: date-time }
              revoked_at: { type: string, format: date-time, nullable: true }
    Hardware:
      type: object
      description: Snapshot reported by the agent (protobuf field names).
      properties:
        hostname: { type: string }
        fqdn: { type: string }
        domain: { type: string }
        os_caption: { type: string }
        os_display_version: { type: string }
        os_edition: { type: string }
        os_build: { type: integer }
        os_ubr: { type: integer }
        os_version: { type: string }
        arch: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serial: { type: string }
        smbios_uuid: { type: string }
        chassis: { type: string }
        bios_version: { type: string }
        cpu_model: { type: string }
        cpu_logical_cores: { type: integer }
        ram_bytes: { type: string, description: uint64 encoded as a string (protobuf JSON) }
        disks:
          type: array
          items:
            type: object
            properties:
              mount: { type: string }
              filesystem: { type: string }
              size_bytes: { type: string }
              free_bytes: { type: string }
              bitlocker: { type: string, enum: [protected, unprotected, encrypting, decrypting, unknown, unsupported, ""] }
        interfaces:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              mac: { type: string }
              addresses: { type: array, items: { type: string } }
        last_logged_on_user: { type: string }
        pending_reboot: { type: boolean }
        pending_reboot_reasons: { type: array, items: { type: string } }
        timezone: { type: string }
        boot_time: { type: string }
    EnrollmentToken:
      type: object
      required: [id, name, max_uses, used_count, expires_at, require_approval, created_at, state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        max_uses: { type: integer }
        used_count: { type: integer }
        expires_at: { type: string, format: date-time }
        require_approval: { type: boolean }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [active, revoked, expired, exhausted] }
    AuditEntry:
      type: object
      required: [id, ts, actor_type, actor_id, action, outcome, target_ids, details]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        actor_type: { type: string }
        actor_id: { type: string }
        actor_ip: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_ids: { type: array, items: { type: string } }
        outcome: { type: string, enum: [success, denied, error] }
        details: { type: object, additionalProperties: true }
security:
  - session: []
