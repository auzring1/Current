syntax = "proto3";

package auzring.agent.v1;

import "auzring/agent/v1/envelope.proto";
import "auzring/agent/v1/inventory.proto";

option go_package = "github.com/auzring1/auzring/gen/proto/auzring/agent/v1;agentv1";

// AgentChannelService requires a verified device client certificate.
// See docs/PROTOCOL.md §4.2.
service AgentChannelService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  // Also allowed with an expired certificate inside the renewal grace period.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

// ConnectRequest is one agent -> server message.
message ConnectRequest {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    InventoryReport inventory = 3;
    SecurityEvent security_event = 4;
  }
}

// ConnectResponse is one server -> agent message.
message ConnectResponse {
  oneof msg {
    HelloAck hello_ack = 1;
    Ack ack = 2;
    ResyncRequest resync = 3;
    GoAway go_away = 4;
    SignedEnvelope job_offer = 5;
  }
}

message Hello {
  string device_id = 1;
  string agent_version = 2;
  string boot_id = 3;
  repeated string capabilities = 4;
  // Last acknowledged revision per inventory section.
  map<string, uint64> revs = 5;
  uint32 outbox_pending = 6;
  int64 cert_not_after = 7;
  string local_policy_hash = 8;
}

message HelloAck {
  int64 server_time = 1;
  repeated bytes job_signing_certs_der = 2;
  // Root-signed revocation statements (PROTOCOL §5).
  repeated SigningKeyRevocation signing_key_revocations = 3;
  repeated InventorySection resync_sections = 4;
  uint32 heartbeat_interval_s = 5;
  // Server suggests renewal when the certificate is inside the renewal window.
  bool renew_certificate = 6;
}

message SigningKeyRevocation {
  bytes key_id = 1;
  int64 revoked_at = 2;
  // ECDSA signature by the root key over "auzring/revoke/v1\x00" || key_id || be64(revoked_at).
  bytes signature = 3;
}

message Heartbeat {
  uint64 uptime_s = 1;
  bool pending_reboot = 2;
  uint64 system_drive_free_bytes = 3;
  string logged_on_user = 4;
}

message Ack {
  uint64 seq = 1;
}

message ResyncRequest {
  InventorySection section = 1;
}

message GoAway {
  uint32 retry_after_s = 1;
  string reason = 2;
}

enum SecurityEventKind {
  SECURITY_EVENT_KIND_UNSPECIFIED = 0;
  SECURITY_EVENT_KIND_BAD_SIGNATURE = 1;
  SECURITY_EVENT_KIND_WRONG_DEVICE = 2;
  SECURITY_EVENT_KIND_REPLAY = 3;
  SECURITY_EVENT_KIND_EXPIRED = 4;
  SECURITY_EVENT_KIND_POLICY_CEILING = 5;
  SECURITY_EVENT_KIND_HASH_MISMATCH = 6;
  SECURITY_EVENT_KIND_SIGNER_MISMATCH = 7;
  SECURITY_EVENT_KIND_BAD_SIGNING_CERT = 8;
}

message SecurityEvent {
  uint64 seq = 1;
  SecurityEventKind kind = 2;
  string detail = 3;
}

message RenewCertificateRequest {
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  bytes client_cert_der = 1;
  bytes issuing_ca_der = 2;
}
