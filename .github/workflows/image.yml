# Publishes the server container image to GitHub's registry (ghcr.io) so installs can PULL it instead of
# building from source. See docs/DECISIONS.md D102 and docs/RUNBOOK.md, "Install from the published image".
#
#   Push to main            -> :edge and :edge-<commit>   (the newest main; for testing, not for production)
#   Run workflow by hand    -> :<version> and :latest     (a release; type the version, for example 1.0.0)
#                              and a GitHub release "server-<version>" with current-deploy-<version>.zip: the few files
#                              (compose file, Caddy and database setup files, secrets script) an install needs next to
#                              the image, so a NAS can download one file instead of cloning the repository,
#                              and current-agent_<version>_windows_amd64.exe (the agent, UNSIGNED) with its .sha256,
#                              current-agent_<version>_windows_x64.msi (built by the "msi" job below),
#                              current-release_<version>_windows_amd64.exe (the tool that makes the update signing key),
#                              and, when an update signing key is configured, current-agent_<version>_windows_amd64.curr
#                              (the SIGNED update file you upload under "Agent updates" in the console)
#
# Automatic agent updates need two settings in the repository (Settings > Secrets and variables > Actions), see
# docs/RUNBOOK.md section 5c: the VARIABLE CURRENT_RELEASE_PUBLIC_KEY (public key(s), hex, comma-separated; built into the
# agents and the zip's .env) and the SECRET CURRENT_RELEASE_SIGNING_KEY (the matching private key; used only to sign, only
# from main). Without them agents are built that cannot update themselves.
#
# This is deliberately separate from release.yml (signed releases with Authenticode and a KMS key, tags "v*").
# It uses no secret: the built-in GITHUB_TOKEN may push to the repository's own package.
#
# The first publish creates the package as PRIVATE. Make it public once: GitHub > your profile/organization >
# Packages > current-server > Package settings > Change visibility > Public (docs/RUNBOOK.md).
#
# NOT YET RUN: written without a GitHub runner. The first run is the test.
name: image
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example 1.0.0 (becomes :1.0.0 and :latest)"
        type: string
        required: true

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the "server-<version>" release that carries the deploy zip (release runs only)
      packages: write   # push to ghcr.io/<owner>/current-server
    env:
      INPUT_VERSION: ${{ inputs.version }}
      GH_ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_PUBKEYS: ${{ vars.CURRENT_RELEASE_PUBLIC_KEY }}   # public keys the agents will trust (not a secret)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Decide the tags
        id: tags
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=12 HEAD)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ $INPUT_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::version must look like 1.2.3 (got '$INPUT_VERSION')"; exit 1; }
            { echo "main=$INPUT_VERSION"; echo "extra=latest"; echo "version=$INPUT_VERSION"; } >> "$GITHUB_OUTPUT"
          else
            { echo "main=edge"; echo "extra=edge-$short"; echo "version=0.0.0-edge.$short"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        env:
          MAIN_TAG: ${{ steps.tags.outputs.main }}
          EXTRA_TAG: ${{ steps.tags.outputs.extra }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          scripts/build-image.sh --version "$VERSION" --commit "$(git rev-parse --short=12 HEAD)" \
            --source-date-epoch "$(git log -1 --format=%ct)" \
            --push "$image:$MAIN_TAG" --digest-file "$RUNNER_TEMP/digest.txt"
          digest=$(cat "$RUNNER_TEMP/digest.txt")
          # The second tag points at the very same image (same digest), nothing is built twice.
          docker buildx imagetools create --tag "$image:$EXTRA_TAG" "$image@$digest"
          {
            echo "### Published"
            echo "- \`$image:$MAIN_TAG\`"
            echo "- \`$image:$EXTRA_TAG\`"
            echo "- digest \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Build the Windows agent and the release tool
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          pkg=github.com/auzring1/current/internal/shared
          ldflags="-s -w -X $pkg/version.Version=$VERSION -X $pkg/version.Commit=$(git rev-parse --short=12 HEAD)"
          if [ -n "$RELEASE_PUBKEYS" ]; then
            IFS=, read -ra keys <<< "$RELEASE_PUBKEYS"
            for k in "${keys[@]}"; do [[ $k =~ ^[0-9a-f]{64}$ ]] || { echo "::error::CURRENT_RELEASE_PUBLIC_KEY must be 64 lowercase hex characters per key, comma-separated"; exit 1; }; done
            ldflags="$ldflags -X $pkg/release.PublicKeysHex=$RELEASE_PUBKEYS"
          else
            echo "::notice::CURRENT_RELEASE_PUBLIC_KEY is not set: this agent will not accept automatic updates"
          fi
          exe="$RUNNER_TEMP/current-agent_${VERSION}_windows_amd64.exe"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "$ldflags" -o "$exe" ./cmd/current-agent
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$exe")" > "$(basename "$exe").sha256")
          # The tool that creates the signing key (keygen) and signs updates; the Windows copy is for the owner's PC.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w" \
            -o "$RUNNER_TEMP/current-release_${VERSION}_windows_amd64.exe" ./cmd/current-release
          ls -l "$exe"
      - name: Sign the agent update (release runs from main, when a signing key is configured)
        id: sign
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          SIGNING_KEY: ${{ secrets.CURRENT_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] && [ -z "$RELEASE_PUBKEYS" ]; then
            echo "::notice::no update signing key configured: no .curr file is made (see docs/RUNBOOK.md section 5c)"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$SIGNING_KEY" ] || [ -z "$RELEASE_PUBKEYS" ]; then
            echo "::error::set BOTH the secret CURRENT_RELEASE_SIGNING_KEY and the variable CURRENT_RELEASE_PUBLIC_KEY, or neither"; exit 1
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::agent updates are signed only for runs from main"; exit 1; }
          umask 077
          keyfile="$RUNNER_TEMP/release.key"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$keyfile"
          go build -o "$RUNNER_TEMP/current-release" ./cmd/current-release
          exe="$RUNNER_TEMP/current-agent_${VERSION}_windows_amd64.exe"
          curr="$RUNNER_TEMP/current-agent_${VERSION}_windows_amd64.curr"
          "$RUNNER_TEMP/current-release" sign --key "$keyfile" --exe "$exe" --version "$VERSION" --notes "Server $VERSION" --out "$curr"
          # The key must belong to one of the public keys built into the agents, otherwise the update would be refused.
          ok=0
          IFS=, read -ra keys <<< "$RELEASE_PUBKEYS"
          for k in "${keys[@]}"; do
            printf '%s\n' "$k" > "$RUNNER_TEMP/trusted.pub"
            if "$RUNNER_TEMP/current-release" verify --bundle "$curr" --exe "$exe" --pub "$RUNNER_TEMP/trusted.pub" >/dev/null 2>&1; then ok=1; fi
          done
          [ "$ok" = 1 ] || { rm -f "$curr"; echo "::error::the signing key does not match CURRENT_RELEASE_PUBLIC_KEY: agents would refuse this update"; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: agent-exe
          path: ${{ runner.temp }}/current-agent_${{ steps.tags.outputs.version }}_windows_amd64.exe
          retention-days: 1
          if-no-files-found: error
      - name: Build the deploy zip
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: CURRENT_RELEASE_PUBKEYS="$RELEASE_PUBKEYS" scripts/make-deploy-bundle.sh "$VERSION" "$RUNNER_TEMP/current-deploy-$VERSION.zip"
      - name: Publish the deploy zip as a GitHub release (release runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/current-deploy-$VERSION.zip"
          exe="$RUNNER_TEMP/current-agent_${VERSION}_windows_amd64.exe"
          tool="$RUNNER_TEMP/current-release_${VERSION}_windows_amd64.exe"
          curr="$RUNNER_TEMP/current-agent_${VERSION}_windows_amd64.curr"
          assets=("$zip" "$exe" "$exe.sha256" "$tool")
          [ -f "$curr" ] && assets+=("$curr")
          tag="server-$VERSION"   # not "v*": that pattern starts the signed release pipeline (release.yml)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/current-deploy-$VERSION.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Server $VERSION" \
              --notes "Server image \`ghcr.io/${GITHUB_REPOSITORY,,}-server:$VERSION\`. current-deploy zip: the server install files (README.txt inside, docs/RUNBOOK.md section 2.2). current-agent exe and msi: for the PCs (section 4); not code-signed, so Windows may warn: check the .sha256 and run Unblock-File. .curr: the signed update file for Agent updates in the console (section 5c), present only when an update signing key is configured. current-release exe: the tool that makes the signing key (section 5c)."
          fi
          {
            echo "- deploy zip: $url"
            echo "- agent exe: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/current-agent_${VERSION}_windows_amd64.exe"
            if [ -f "$curr" ]; then echo "- signed update file: current-agent_${VERSION}_windows_amd64.curr (upload it under Agent updates)"; else echo "- no signed update file (no signing key configured)"; fi
            echo ""
            echo "On the server: \`curl -L -o current-deploy.zip $url && unzip current-deploy.zip\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Windows installer (MSI). It wraps the very same agent exe that was built and signed above, so the update file
  # and the MSI always match. Built on Windows because WiX needs it; attached to the same release.
  msi:
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: windows-2025
    permissions:
      contents: write   # attach the MSI to the release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-exe
          path: dist
      - name: Build the MSI (WiX from .config/dotnet-tools.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\current-agent_${env:VERSION}_windows_amd64.exe"
          if (-not (Test-Path $exe)) { throw "the agent exe was not handed over: $exe" }
          ./installer/windows/build.ps1 -AgentExe $exe -Version $env:VERSION -Output "$PWD\dist\current-agent_${env:VERSION}_windows_x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }
          Get-Item "dist\current-agent_${env:VERSION}_windows_x64.msi" | Format-List Name, Length
      - name: Attach the MSI to the release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh release upload "server-${env:VERSION}" "dist\current-agent_${env:VERSION}_windows_x64.msi" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "could not attach the MSI" }
          Add-Content $env:GITHUB_STEP_SUMMARY "- MSI: current-agent_${env:VERSION}_windows_x64.msi (attached to the release)"
