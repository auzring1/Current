# LibrePatch production stack. See docs/RUNBOOK.md for installation.
#   1. ./scripts/init-secrets.sh        (creates deploy/secrets/*)
#   2. cp deploy/.env.example deploy/.env and edit LIBREPATCH_HOSTNAME / LIBREPATCH_CADDY_TLS
#   3. docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: librepatch

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# The server image is built once; "server" and "maintenance" both use it.
x-server-build: &server-build
  context: ..
  dockerfile: deploy/Dockerfile.server

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      server: { condition: service_healthy }
    ports:
      - "${LIBREPATCH_HTTP_PORT:-80}:80"
      - "${LIBREPATCH_HTTPS_PORT:-443}:443"
      - "${LIBREPATCH_HTTPS_PORT:-443}:443/udp"
    environment:
      LIBREPATCH_HOSTNAME: ${LIBREPATCH_HOSTNAME:?set LIBREPATCH_HOSTNAME in deploy/.env}
      LIBREPATCH_CADDY_TLS: ${LIBREPATCH_CADDY_TLS:-internal}
      # Only used by Caddyfile.behind-proxy: the addresses whose X-Forwarded-For header Caddy believes.
      LIBREPATCH_UPSTREAM_PROXIES: ${LIBREPATCH_UPSTREAM_PROXIES:-${LIBREPATCH_FRONTEND_SUBNET:-172.31.250.0/24}}
    volumes:
      # LIBREPATCH_CADDYFILE=./Caddyfile.behind-proxy when your own reverse proxy (for example Synology DSM) does the
      # browser TLS; see docs/RUNBOOK.md, "Behind your own reverse proxy".
      - ${LIBREPATCH_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      frontend:
        # Fixed address: the server trusts X-Forwarded-For only from this IP.
        ipv4_address: ${LIBREPATCH_CADDY_IP:-172.31.250.10}

  server:
    <<: *hardening
    build: *server-build
    image: librepatch/server:${LIBREPATCH_VERSION:-dev}
    depends_on:
      postgres: { condition: service_healthy }
      # Migrations run in the one-shot "maintenance" service, which alone holds the schema-owner
      # credential (SECURITY.md T-SRV-4): the long-running server only gets the DML-only app role.
      maintenance: { condition: service_completed_successfully }
    ports:
      # Agent gateway: mTLS terminated by the server itself (never proxied).
      - "${LIBREPATCH_GATEWAY_PORT:-8443}:8443"
    environment:
      LIBREPATCH_PUBLIC_URL: https://${LIBREPATCH_HOSTNAME}${LIBREPATCH_PUBLIC_PORT_SUFFIX:-}
      LIBREPATCH_GATEWAY_PUBLIC_ADDR: ${LIBREPATCH_GATEWAY_HOSTNAME:-${LIBREPATCH_HOSTNAME}}:${LIBREPATCH_GATEWAY_PORT:-8443}
      LIBREPATCH_GATEWAY_SANS: ${LIBREPATCH_GATEWAY_SANS:-}
      # Caddy, plus (behind your own reverse proxy only) the addresses of that proxy as Caddy sees them.
      LIBREPATCH_TRUSTED_PROXIES: ${LIBREPATCH_CADDY_IP:-172.31.250.10}/32 ${LIBREPATCH_UPSTREAM_PROXIES:-${LIBREPATCH_CADDY_IP:-172.31.250.10}/32}
      LIBREPATCH_DATABASE_URL_FILE: /run/secrets/database_url
      LIBREPATCH_MIGRATE_ON_START: "false"
      LIBREPATCH_MASTER_KEY_FILE: /run/secrets/master_key
      LIBREPATCH_LOG_LEVEL: ${LIBREPATCH_LOG_LEVEL:-info}
      # Uploaded (custom) installers; winget packages are never stored here.
      LIBREPATCH_CONTENT_DIR: /var/lib/librepatch/content
      LIBREPATCH_WINGET_SOURCE: ${LIBREPATCH_WINGET_SOURCE:-github}
      LIBREPATCH_WINGET_INDEX_URL: ${LIBREPATCH_WINGET_INDEX_URL:-}
      LIBREPATCH_RELEASE_PUBLIC_KEYS: ${LIBREPATCH_RELEASE_PUBLIC_KEYS:-}
    volumes:
      - content:/var/lib/librepatch/content
    secrets: [database_url, master_key]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    user: "65532:65532"
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "/librepatch-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot job: applies database migrations, then exits. It is also the way to run the commands that
  # need the schema-owner connection (backup, restore), which the running server cannot do:
  #   docker compose -f deploy/docker-compose.yml run --rm --no-deps -T maintenance backup --out - --recipient age1...
  maintenance:
    security_opt:
      - no-new-privileges:true
    restart: "no"
    build: *server-build
    image: librepatch/server:${LIBREPATCH_VERSION:-dev}
    command: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Same configuration file parser as the server; these two are required by it.
      LIBREPATCH_PUBLIC_URL: https://${LIBREPATCH_HOSTNAME}${LIBREPATCH_PUBLIC_PORT_SUFFIX:-}
      LIBREPATCH_GATEWAY_PUBLIC_ADDR: ${LIBREPATCH_GATEWAY_HOSTNAME:-${LIBREPATCH_HOSTNAME}}:${LIBREPATCH_GATEWAY_PORT:-8443}
      LIBREPATCH_DATABASE_URL_FILE: /run/secrets/database_url
      LIBREPATCH_MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
      LIBREPATCH_MASTER_KEY_FILE: /run/secrets/master_key
      LIBREPATCH_LOG_LEVEL: ${LIBREPATCH_LOG_LEVEL:-info}
      LIBREPATCH_CONTENT_DIR: /var/lib/librepatch/content
    volumes:
      - content:/var/lib/librepatch/content
    secrets: [database_url, migrate_database_url, master_key]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    user: "65532:65532"
    networks: [backend]

  postgres:
    <<: *hardening
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # No ports: reachable only from the server on the internal backend network.
    environment:
      POSTGRES_DB: librepatch
      # The bootstrap superuser is used only by the init script (01-roles.sh), which creates the
      # non-superuser schema owner librepatch_owner and the runtime role librepatch_app.
      POSTGRES_USER: librepatch_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      # Network logins require SCRAM; the local socket is only reachable inside the container.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_admin_password, postgres_owner_password, postgres_app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 256m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librepatch_admin -d librepatch"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  frontend:
    ipam:
      config:
        - subnet: ${LIBREPATCH_FRONTEND_SUBNET:-172.31.250.0/24}
  backend:
    internal: true

volumes:
  content:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  master_key: { file: ./secrets/master_key }
  database_url: { file: ./secrets/database_url }
  migrate_database_url: { file: ./secrets/migrate_database_url }
  postgres_admin_password: { file: ./secrets/postgres_admin_password }
  postgres_owner_password: { file: ./secrets/postgres_owner_password }
  postgres_app_password: { file: ./secrets/postgres_app_password }
