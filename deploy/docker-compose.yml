# Auzring production stack. See docs/RUNBOOK.md for installation.
#   1. ./scripts/init-secrets.sh        (creates deploy/secrets/*)
#   2. cp deploy/.env.example deploy/.env and edit AUZ_HOSTNAME / AUZ_CADDY_TLS
#   3. docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: auzring

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      server: { condition: service_healthy }
    ports:
      - "${AUZ_HTTP_PORT:-80}:80"
      - "${AUZ_HTTPS_PORT:-443}:443"
      - "${AUZ_HTTPS_PORT:-443}:443/udp"
    environment:
      AUZ_HOSTNAME: ${AUZ_HOSTNAME:?set AUZ_HOSTNAME in deploy/.env}
      AUZ_CADDY_TLS: ${AUZ_CADDY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      frontend:
        # Fixed address: the server trusts X-Forwarded-For only from this IP.
        ipv4_address: ${AUZ_CADDY_IP:-172.31.250.10}

  server:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: auzring/server:${AUZ_VERSION:-dev}
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      # Agent gateway: mTLS terminated by the server itself (never proxied).
      - "${AUZ_GATEWAY_PORT:-8443}:8443"
    environment:
      AUZ_PUBLIC_URL: https://${AUZ_HOSTNAME}${AUZ_PUBLIC_PORT_SUFFIX:-}
      AUZ_GATEWAY_PUBLIC_ADDR: ${AUZ_GATEWAY_HOSTNAME:-${AUZ_HOSTNAME}}:${AUZ_GATEWAY_PORT:-8443}
      AUZ_GATEWAY_SANS: ${AUZ_GATEWAY_SANS:-}
      AUZ_TRUSTED_PROXIES: ${AUZ_CADDY_IP:-172.31.250.10}/32
      AUZ_DATABASE_URL_FILE: /run/secrets/database_url
      AUZ_MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
      AUZ_MASTER_KEY_FILE: /run/secrets/master_key
      AUZ_LOG_LEVEL: ${AUZ_LOG_LEVEL:-info}
    secrets: [database_url, migrate_database_url, master_key]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    user: "65532:65532"
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "/auzring-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    <<: *hardening
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # No ports: reachable only from the server on the internal backend network.
    environment:
      POSTGRES_DB: auzring
      POSTGRES_USER: auzring_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      # Network logins require SCRAM; the local socket is only reachable inside the container.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_owner_password, postgres_app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 256m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auzring_owner -d auzring"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  frontend:
    ipam:
      config:
        - subnet: ${AUZ_FRONTEND_SUBNET:-172.31.250.0/24}
  backend:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  master_key: { file: ./secrets/master_key }
  database_url: { file: ./secrets/database_url }
  migrate_database_url: { file: ./secrets/migrate_database_url }
  postgres_owner_password: { file: ./secrets/postgres_owner_password }
  postgres_app_password: { file: ./secrets/postgres_app_password }
